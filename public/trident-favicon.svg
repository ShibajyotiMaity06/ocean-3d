<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tridentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00d4aa" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Oceanic Rounded Background Container -->
  <rect width="64" height="64" rx="14" fill="#070a14" />
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(0, 240, 255, 0.45)" stroke-width="1.5" />

  <!-- Complete Trident Geometry with Full Center Shaft & Middle Stick -->
  <g filter="url(#glow)">
    <!-- Solid Center Main Shaft (From Center Blade Base down to Bottom) -->
    <rect x="30" y="14" width="4" height="42" rx="2" fill="url(#tridentGrad)" />

    <!-- Center Spearhead Point -->
    <polygon points="32,4 25,18 32,15 39,18" fill="url(#tridentGrad)" />
    <!-- Center Shaft Reinforcement Ridge -->
    <line x1="32" y1="12" x2="32" y2="56" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

    <!-- Left Outer Curved Prong & Spearhead -->
    <path d="M 16,19 Q 17,34 32,36" stroke="url(#tridentGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <polygon points="16,9 10,21 16,18 22,21" fill="url(#tridentGrad)" />

    <!-- Right Outer Curved Prong & Spearhead -->
    <path d="M 48,19 Q 47,34 32,36" stroke="url(#tridentGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <polygon points="48,9 42,21 48,18 54,21" fill="url(#tridentGrad)" />

    <!-- Cross Guard Base Collar -->
    <rect x="20" y="34" width="24" height="4" rx="2" fill="url(#tridentGrad)" />
    
    <!-- Pommel / Bottom Spear Spike -->
    <polygon points="32,60 28,54 36,54" fill="url(#tridentGrad)" />
  </g>
</svg>
